<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um convite para Mariana ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family: Georgia, "Times New Roman", serif;
  background:linear-gradient(135deg,#160b10,#3a1824,#160b10);
  color:#fff; overflow:hidden;
}
.card{
  width:min(90%,520px); padding:48px 30px; text-align:center;
  border:1px solid rgba(255,255,255,.18); border-radius:28px;
  background:rgba(255,255,255,.08); backdrop-filter:blur(12px);
  box-shadow:0 25px 70px rgba(0,0,0,.45);
  animation:fade 1.4s ease;
}
.heart{font-size:42px; animation:pulse 1.8s infinite}
h1{font-size:38px;margin:12px 0 8px;font-weight:500}
.subtitle{font-size:17px;opacity:.8;margin-bottom:34px}
.message{font-size:21px;line-height:1.65;margin:0 auto 30px}
.info{font-family:Arial,sans-serif;font-size:15px;line-height:1.9;opacity:.9}
.highlight{font-size:18px;color:#ffd9e3}
button{
  margin-top:28px; padding:14px 28px; border:0; border-radius:999px;
  background:#fff;color:#32131e;font-weight:bold;font-size:16px;cursor:pointer;
  transition:.25s;
}
button:hover{transform:scale(1.05)}
#answer{display:none;margin-top:20px;font-size:18px;color:#ffd9e3}
.fall{position:fixed;top:-30px;font-size:18px;opacity:.35;animation:fall linear infinite}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

.photo-wrap{
  width:170px;height:170px;margin:0 auto 25px;border-radius:50%;
  padding:4px;background:rgba(255,255,255,.18);
  box-shadow:0 10px 35px rgba(0,0,0,.28);
  overflow:hidden;
}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 48%;border-radius:50%;display:block}
</style>
